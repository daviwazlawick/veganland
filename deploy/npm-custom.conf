# novaqi-v2 (novaqi-v2.76-13-238-26.sslip.io): fora da tela do NPM, ver /opt/novaqi-v2/deploy.
# Certificado: /etc/letsencrypt/live/novaqi-v2 (renovado por /etc/cron.d/novaqi-v2-cert no host).
server {
  set $forward_scheme http;
  set $server         "novaqi-v2-web";
  set $port           80;

  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name novaqi-v2.76-13-238-26.sslip.io;
  http2 on;

  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/novaqi-v2/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/novaqi-v2/privkey.pem;

  include conf.d/include/block-exploits.conf;
  set $trust_forwarded_proto "F";
  include conf.d/include/force-ssl.conf;

  client_max_body_size 12m;
  # A geração do plano pela IA leva até ~90 s.
  proxy_read_timeout 240s;
  proxy_send_timeout 240s;

  access_log /data/logs/novaqi-v2_access.log proxy;
  error_log /data/logs/novaqi-v2_error.log warn;

  location / {
    include conf.d/include/proxy.conf;
  }
}
