# Arquivo estático do Expo export + tudo que não é arquivo vai pra API Node.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /_expo/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location /assets/ { expires 30d; }

  location / {
    try_files $uri @api;
  }
  location @api {
    proxy_pass http://novaqi-v2-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 240s;
  }
}
